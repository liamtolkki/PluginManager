name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout PluginManager
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path . -Recurse -File |
              Where-Object { $_.Extension -in @('.ps1', '.psm1') }
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              throw "PowerShell syntax validation failed for $($file.FullName)"
            }
          }

      - name: Validate Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          Import-Module .\PluginManager.Orchestration.psm1 -Force
          Import-Module .\PluginManager.psm1 -Force

          $catalog = Get-PluginCatalog -CatalogPath .\plugins.json
          Assert-CatalogDependencyGraph -Catalog $catalog
          $order = @(Get-DependencyOrder -Catalog $catalog)
          if ($order -notcontains 'sanctuary') {
            throw 'Expected Sanctuary in dependency order.'
          }

          $release = Get-GitHubRelease -Repository "liamtolkki/Sanctuary" -Channel Prerelease
          if (-not $release.prerelease) {
            throw "Expected a Sanctuary prerelease."
          }
          Write-Host "Selected $($release.tag_name)"

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: Invoke-Pester ./tests -CI
