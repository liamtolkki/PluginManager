name: Patch state compatibility

on:
  push:
    paths:
      - .github/workflows/patch-state-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest

    steps:
      - name: Checkout PluginManager
        uses: actions/checkout@v6

      - name: Patch PowerShell 5.1 compatibility
        shell: pwsh
        run: |
          $path = "PluginManager.psm1"
          $content = Get-Content -Path $path -Raw
          $pattern = '(?s)function Read-JsonHashtable \{.*?\r?\n\}\r?\n\r?\nfunction Write-JsonAtomic'

          $replacement = @(
            'function ConvertTo-PluginManagerHashtable {'
            '    param($Value)'
            ''
            '    if ($null -eq $Value) {'
            '        return $null'
            '    }'
            '    if ($Value -is [System.Collections.IDictionary]) {'
            '        $result = @{}'
            '        foreach ($key in $Value.Keys) {'
            '            $result[[string]$key] = ConvertTo-PluginManagerHashtable $Value[$key]'
            '        }'
            '        return $result'
            '    }'
            '    if ($Value -is [System.Management.Automation.PSCustomObject]) {'
            '        $result = @{}'
            '        foreach ($property in $Value.PSObject.Properties) {'
            '            $result[$property.Name] = ConvertTo-PluginManagerHashtable $property.Value'
            '        }'
            '        return $result'
            '    }'
            '    if ($Value -is [System.Collections.IEnumerable] -and -not ($Value -is [string])) {'
            '        $items = @()'
            '        foreach ($item in $Value) {'
            '            $items += ,(ConvertTo-PluginManagerHashtable $item)'
            '        }'
            '        return $items'
            '    }'
            '    return $Value'
            '}'
            ''
            'function Read-JsonHashtable {'
            '    param([Parameter(Mandatory)][string]$Path)'
            ''
            '    if (-not (Test-Path -LiteralPath $Path)) {'
            '        return $null'
            '    }'
            ''
            '    $parsed = Get-Content -LiteralPath $Path -Raw | ConvertFrom-Json'
            '    return ConvertTo-PluginManagerHashtable $parsed'
            '}'
            ''
            'function Write-JsonAtomic'
          ) -join "`n"

          $regex = [regex]::new($pattern)
          if (-not $regex.IsMatch($content)) {
            throw "Expected Read-JsonHashtable implementation was not found."
          }

          $content = $regex.Replace($content, $replacement, 1)
          $content = $content.Replace(
            'return [ordered]@{ schemaVersion = 1; plugins = [ordered]@{} }',
            'return @{ schemaVersion = 1; plugins = @{} }'
          )
          $content = $content.Replace(
            '$state.plugins = [ordered]@{}',
            '$state.plugins = @{}'
          )
          Set-Content -Path $path -Value $content -Encoding utf8

          $orchestrationPath = "PluginManager.Orchestration.psm1"
          $orchestration = Get-Content -Path $orchestrationPath -Raw
          $orchestration = $orchestration.Replace(
            '[Parameter(Mandatory)][System.Collections.Generic.List[string]]$Stack',
            '[Parameter(Mandatory)][AllowEmptyCollection()][System.Collections.Generic.List[string]]$Stack'
          )
          $orchestration = $orchestration.Replace(
            '[Parameter(Mandatory)][System.Collections.Generic.List[string]]$Result',
            '[Parameter(Mandatory)][AllowEmptyCollection()][System.Collections.Generic.List[string]]$Result'
          )
          $orchestration = $orchestration.Replace(
            '[Parameter(Mandatory)][object[]]$Inventory',
            '[Parameter(Mandatory)][AllowEmptyCollection()][object[]]$Inventory'
          )
          Set-Content -Path $orchestrationPath -Value $orchestration -Encoding utf8

      - name: Validate Windows PowerShell 5.1 behavior
        shell: powershell
        run: |
          Import-Module .\PluginManager.Orchestration.psm1 -Force
          Import-Module .\PluginManager.psm1 -Force

          $statePath = Join-Path $env:RUNNER_TEMP 'state.json'
          '{"schemaVersion":1,"plugins":{"sanctuary":{"version":"0.1.0-alpha.1","enabled":true}}}' | Set-Content -Path $statePath -Encoding UTF8
          & (Get-Module PluginManager) {
            param($Path)
            $state = Get-ManagerState -Path $Path
            if (-not $state.plugins.ContainsKey('sanctuary')) {
              throw 'Expected Sanctuary state record.'
            }
            if ($state.plugins['sanctuary'].version -ne '0.1.0-alpha.1') {
              throw 'Unexpected Sanctuary state version.'
            }

            $empty = Get-ManagerState -Path (Join-Path (Split-Path -Parent $Path) 'missing.json')
            $empty.plugins['anything'] = @{ version = 'test' }
          } $statePath

          $catalog = Get-PluginCatalog -CatalogPath .\plugins.json
          Assert-CatalogDependencyGraph -Catalog $catalog
          $order = @(Get-DependencyOrder -Catalog $catalog)
          if ($order -notcontains 'sanctuary') {
            throw 'Expected Sanctuary in dependency order.'
          }

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PluginManager.psm1 PluginManager.Orchestration.psm1
          git commit -m "Fix Windows PowerShell collection compatibility"
          git pull --rebase origin main
          git push origin main
