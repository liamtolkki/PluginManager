name: Patch state compatibility

on:
  push:
    paths:
      - .github/workflows/patch-state-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest

    steps:
      - name: Checkout PluginManager
        uses: actions/checkout@v6

      - name: Remove duplicate compatibility helper
        shell: pwsh
        run: |
          $path = "PluginManager.psm1"
          $content = Get-Content -Path $path -Raw
          $marker = "function ConvertTo-PluginManagerHashtable {"
          $first = $content.IndexOf($marker, [System.StringComparison]::Ordinal)
          if ($first -lt 0) {
            throw "Compatibility helper was not found."
          }

          $second = $content.IndexOf(
            $marker,
            $first + $marker.Length,
            [System.StringComparison]::Ordinal
          )

          if ($second -ge 0) {
            $readFunction = $content.IndexOf(
              "function Read-JsonHashtable {",
              $second,
              [System.StringComparison]::Ordinal
            )
            if ($readFunction -lt 0) {
              throw "Read-JsonHashtable was not found after duplicate helper."
            }
            $content = $content.Remove($second, $readFunction - $second)
          }

          $count = ([regex]::Matches(
            $content,
            'function ConvertTo-PluginManagerHashtable \{'
          )).Count
          if ($count -ne 1) {
            throw "Expected exactly one compatibility helper after cleanup, found $count."
          }

          Set-Content -Path $path -Value $content -Encoding utf8

      - name: Validate Windows PowerShell 5.1 behavior
        shell: powershell
        run: |
          Import-Module .\PluginManager.Orchestration.psm1 -Force
          Import-Module .\PluginManager.psm1 -Force

          $catalog = Get-PluginCatalog -CatalogPath .\plugins.json
          Assert-CatalogDependencyGraph -Catalog $catalog
          $order = @(Get-DependencyOrder -Catalog $catalog)
          if ($order -notcontains 'sanctuary') {
            throw 'Expected Sanctuary in dependency order.'
          }

          $statePath = Join-Path $env:RUNNER_TEMP 'state.json'
          '{"schemaVersion":1,"plugins":{"sanctuary":{"version":"0.1.0-alpha.1","enabled":true}}}' | Set-Content -Path $statePath -Encoding UTF8
          & (Get-Module PluginManager) {
            param($Path)
            $state = Get-ManagerState -Path $Path
            if (-not $state.plugins.ContainsKey('sanctuary')) {
              throw 'Expected Sanctuary state record.'
            }
          } $statePath

      - name: Commit cleanup
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PluginManager.psm1
          if (git diff --cached --quiet) {
            Write-Host "No cleanup changes were needed."
            exit 0
          }
          git commit -m "Remove duplicate compatibility helper"
          git pull --rebase origin main
          git push origin main
