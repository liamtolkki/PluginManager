name: Patch dependency guard

on:
  push:
    paths:
      - .github/workflows/patch-dependency-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest

    steps:
      - name: Checkout PluginManager
        uses: actions/checkout@v6

      - name: Patch empty dependent handling
        shell: pwsh
        run: |
          $path = "PluginManager.Orchestration.psm1"
          $content = Get-Content -Path $path -Raw

          $old = @(
            '    $dependents = if ($Operation -eq "disable") {'
            '        @(Get-InstalledDependents -Catalog $Catalog -Inventory $Inventory -ManagedId $Item.ManagedId -EnabledOnly)'
            '    }'
            '    else {'
            '        @(Get-InstalledDependents -Catalog $Catalog -Inventory $Inventory -ManagedId $Item.ManagedId)'
            '    }'
          ) -join "`n"

          $new = @(
            '    $dependents = @(if ($Operation -eq "disable") {'
            '        Get-InstalledDependents -Catalog $Catalog -Inventory $Inventory -ManagedId $Item.ManagedId -EnabledOnly'
            '    }'
            '    else {'
            '        Get-InstalledDependents -Catalog $Catalog -Inventory $Inventory -ManagedId $Item.ManagedId'
            '    })'
          ) -join "`n"

          $normalized = $content.Replace("`r`n", "`n")
          if (-not $normalized.Contains($old)) {
            throw "Expected dependency guard implementation was not found."
          }
          $normalized = $normalized.Replace($old, $new)
          Set-Content -Path $path -Value $normalized -Encoding utf8

      - name: Run Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester .\tests -CI

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PluginManager.Orchestration.psm1
          git commit -m "Fix empty dependency guard results"
          git pull --rebase origin main
          git push origin main
